services:
  kafka:
    image: ${KAFKA_IMAGE:-confluentinc/cp-kafka:7.4.0}
    ports:
      - target: 9092
        published: ${KAFKA_PORT:-9092}
      - target: 29092
        published: ${KAFKA_PORT_EXT:-29092}
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: 'broker,controller'
      KAFKA_CONTROLLER_QUORUM_VOTERS: '1@kafka:29093'
      KAFKA_LISTENERS: 'PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:29093,PLAINTEXT_HOST://0.0.0.0:29092'
      KAFKA_ADVERTISED_LISTENERS: 'PLAINTEXT://kafka:9092,PLAINTEXT_HOST://localhost:${KAFKA_PORT_EXT:-29092}'
      KAFKA_INTER_BROKER_LISTENER_NAME: 'PLAINTEXT'
      KAFKA_CONTROLLER_LISTENER_NAMES: 'CONTROLLER'
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: 'CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT'
      CLUSTER_ID: ${CLUSTER_ID:-MkU3OEVBNTcwNTJENDM2Qk}
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_HEAP_OPTS: ${KAFKA_HEAP_OPTS:--Xms512M -Xmx1G}
    deploy:
      replicas: 1
      resources:
        limits:
          cpus: ${KAFKA_CPU_LIMIT:-1}
          memory: ${KAFKA_MEM_LIMIT:-1.5G}
        reservations:
          cpus: '0.5'
          memory: 1G
      placement:
        constraints:
          - ${PLACEMENT_CONSTRAINT:-node.role == worker}

  clickhouse:
    image: ${CH_IMAGE:-clickhouse/clickhouse-server:latest}
    ports:
      - target: 8123
        published: ${CH_HTTP_PORT:-8123}
      - target: 9000
        published: ${CH_NATIVE_PORT:-9000}
    environment:
      - CLICKHOUSE_USER=${CH_USER:-monitoreo}
      - CLICKHOUSE_PASSWORD=${CH_PASS:-monitoreo_dev}
      - CLICKHOUSE_DB=${CH_DB:-bunna_monitoreo}
    volumes:
      - clickhouse_data_${ENV:-prod}:/var/lib/clickhouse
    deploy:
      replicas: 1
      resources:
        limits:
          cpus: ${CH_CPU_LIMIT:-1}
          memory: ${CH_MEM_LIMIT:-2G}
        reservations:
          cpus: '0.5'
          memory: 1G
      placement:
        constraints:
          - ${PLACEMENT_CONSTRAINT:-node.role == worker}

  grafana:
    image: ${GRAFANA_IMAGE:-grafana/grafana:latest}
    ports:
      - target: 3000
        published: ${GRAFANA_PORT:-3000}
    environment:
      - GF_INSTALL_PLUGINS=${GF_INSTALL_PLUGINS:-grafana-clickhouse-datasource}
      - GF_SECURITY_ADMIN_USER=${GF_SECURITY_ADMIN_USER:-admin}
      - GF_SECURITY_ADMIN_PASSWORD=${GF_SECURITY_ADMIN_PASSWORD:-admin}
    deploy:
      replicas: 1
      resources:
        limits:
          cpus: ${GRAFANA_CPU_LIMIT:-0.5}
          memory: ${GRAFANA_MEM_LIMIT:-256M}
        reservations:
          cpus: '0.25'
          memory: 128M
      placement:
        constraints:
          - ${PLACEMENT_CONSTRAINT:-node.role == worker}

volumes:
  clickhouse_data_prod:

networks:
  default:
    name: bunna-prod-net
    driver: overlay
    attachable: true
