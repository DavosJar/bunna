services:
  db:
    image: postgres:16-alpine
    container_name: identidad-db-dev
    environment:
      - POSTGRES_USER=identidad_user
      - POSTGRES_PASSWORD=identidad_pass_dev
      - POSTGRES_DB=identidad_db
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U identidad_user -d identidad_db"]
      interval: 5s
      timeout: 5s
      retries: 5
    volumes:
      - bunna_postgres_data:/var/lib/postgresql/data
    networks:
      - bunna-network

  identidad-app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: identidad-app-dev
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8080:8080"
    environment:
      - DB_HOST=db
      - DB_PORT=5432
      - DB_USER=identidad_user
      - DB_PASSWORD=identidad_pass_dev
      - DB_NAME=identidad_db
      - DB_SSLMODE=disable
      - PORT=8080
      - JWT_SECRET=supersecreto_dev_cambiar_en_prod
      - JWT_ISSUER=identidad.bunna
      - TELEMETRY_ENABLED=true
      - KAFKA_BROKERS=kafka:9092
    networks:
      - bunna-network

networks:
  bunna-network:
    external: true

volumes:
  bunna_postgres_data:
