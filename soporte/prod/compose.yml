services:
  identidad:
    image: ${REGISTRY:-172.31.36.189:5000}/identidad:release
    env_file:
      - ./identidad.env
    environment:
      - DB_SSLMODE=require
      - KAFKA_BROKERS=kafka:9092
      - KAFKA_TOPIC_PERMISOS=prod.permisos
      - ENVIRONMENT=prod
    ports:
      - target: 8080
        published: 8080
    deploy:
      replicas: 1
      placement:
        constraints:
          - ${PLACEMENT_CONSTRAINT:-node.role == worker}

  fincas:
    image: ${REGISTRY:-172.31.36.189:5000}/fincas:release
    env_file:
      - ./fincas.env
    environment:
      - DB_SSLMODE=require
      - KAFKA_BROKERS=kafka:9092
      - KAFKA_TOPIC_PERMISOS=prod.permisos
      - ENVIRONMENT=prod
    ports:
      - target: 8082
        published: 8082
    deploy:
      replicas: 1
      placement:
        constraints:
          - ${PLACEMENT_CONSTRAINT:-node.role == worker}

networks:
  default:
    name: bunna-prod-net
    driver: overlay
    attachable: true
