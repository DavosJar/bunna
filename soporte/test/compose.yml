services:
  kafka:
    image: ${KAFKA_IMAGE:-confluentinc/cp-kafka:7.4.0}
    ports:
      - target: 9092
        published: ${KAFKA_PORT:-19092}
      - target: 29092
        published: ${KAFKA_PORT_EXT:-19093}
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: 'broker,controller'
      KAFKA_CONTROLLER_QUORUM_VOTERS: '1@kafka:29093'
      KAFKA_LISTENERS: 'INTERNAL://0.0.0.0:9092,CONTROLLER://0.0.0.0:29093,EXTERNAL://0.0.0.0:29092'
      KAFKA_ADVERTISED_LISTENERS: 'INTERNAL://kafka:9092,EXTERNAL://${KAFKA_PUBLIC_HOST:-localhost}:${KAFKA_PORT_EXT:-19093}'
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: 'CONTROLLER:PLAINTEXT,INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT'
      KAFKA_INTER_BROKER_LISTENER_NAME: 'INTERNAL'
      KAFKA_CONTROLLER_LISTENER_NAMES: 'CONTROLLER'
      CLUSTER_ID: ${CLUSTER_ID:-MkU3OEVBNTcwNTJENDM2Qk}
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_HEAP_OPTS: ${KAFKA_HEAP_OPTS:--Xms128M -Xmx256M}
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    deploy:
      replicas: 1
      placement:
        constraints:
          - ${PLACEMENT_CONSTRAINT:-node.role == worker}

  hardware-monitor-agent:
    image: 172.31.36.189:5000/hardware-monitor-agent:release
    depends_on:
      - kafka
    environment:
      - KAFKA_BROKERS=kafka:9092
      - SAMPLE_INTERVAL_MS=5000
      - KAFKA_TOPIC=hardware_metrics
      - CLOUD_PROVIDER=AWS
      - NODE_ID={{.Node.Hostname}}
    volumes:
      - /etc/hostname:/etc/host_hostname:ro
    deploy:
      mode: global

  servicio-monitoreo:
    image: 172.31.36.189:5000/servicio-monitoreo:release
    depends_on:
      - kafka
      - clickhouse
    environment:
      - KAFKA_BROKERS=kafka:9092
      - KAFKA_TOPIC_TELEMETRIA=telemetry
      - KAFKA_TOPIC_HARDWARE_METRICAS=hardware.metrics
      - KAFKA_TOPIC_HARDWARE_ALERTAS=hardware.alerts
      - GRUPO_CONSUMIDOR=monitor-ingestor-${ENV:-test}
      - CLICKHOUSE_URL=http://clickhouse:8123
      - CLICKHOUSE_USUARIO=monitoreo
      - CLICKHOUSE_CONTRASENA=monitoreo_dev
      - CLICKHOUSE_BD=bunna_monitoreo
      - RUST_LOG=info
    deploy:
      replicas: 1
      placement:
        constraints:
          - ${PLACEMENT_CONSTRAINT:-node.role == worker}

  clickhouse:
    image: ${CH_IMAGE:-clickhouse/clickhouse-server:latest}
    ports:
      - target: 8123
        published: ${CH_HTTP_PORT:-18123}
      - target: 9000
        published: ${CH_NATIVE_PORT:-19000}
    environment:
      - CLICKHOUSE_USER=${CH_USER:-monitoreo}
      - CLICKHOUSE_PASSWORD=${CH_PASS:-monitoreo_dev}
      - CLICKHOUSE_DB=${CH_DB:-bunna_monitoreo}
    volumes:
      - clickhouse_data_test:/var/lib/clickhouse
    configs:
      - source: clickhouse_init_sql
        target: /docker-entrypoint-initdb.d/001_tablas.sql
    deploy:
      replicas: 1
      placement:
        constraints:
          - ${PLACEMENT_CONSTRAINT:-node.role == worker}

  grafana:
    image: ${GRAFANA_IMAGE:-grafana/grafana:latest}
    ports:
      - target: 3000
        published: ${GRAFANA_PORT:-13000}
    environment:
      - GF_INSTALL_PLUGINS=${GF_INSTALL_PLUGINS:-grafana-clickhouse-datasource}
      - GF_SECURITY_ADMIN_USER=${GF_SECURITY_ADMIN_USER:-admin}
      - GF_SECURITY_ADMIN_PASSWORD=${GF_SECURITY_ADMIN_PASSWORD:-admin}
    configs:
      - source: clickhouse_datasource
        target: /etc/grafana/provisioning/datasources/clickhouse.yaml
      - source: dashboards_provider
        target: /etc/grafana/provisioning/dashboards/proveedor.yaml
      - source: hardware_metrics_dashboard
        target: /etc/grafana/provisioning/dashboards/hardware-metrics.json
      - source: api_telemetry_dashboard
        target: /etc/grafana/provisioning/dashboards/api-telemetry.json
      - source: api_full_telemetry_dashboard
        target: /etc/grafana/provisioning/dashboards/api-full-telemetry.json
    deploy:
      replicas: 1

  identidad:
    image: 172.31.36.189:5000/identidad:release
    depends_on:
      - kafka
    env_file:
      - ./identidad.env
    environment:
      - DB_SSLMODE=require
      - KAFKA_BROKERS=kafka:9092
    ports:
      - target: 8080
        published: 18080
    deploy:
      replicas: 1
      placement:
        constraints:
          - ${PLACEMENT_CONSTRAINT:-node.role == worker}

volumes:
  clickhouse_data_test:

networks:
  default:
    name: bunna-test-net
    driver: overlay
    attachable: true

configs:
  clickhouse_datasource:
    file: ../../servicio-monitoreo/grafana/datasources/clickhouse.yaml
  dashboards_provider:
    file: ../../servicio-monitoreo/grafana/dashboards/proveedor.yaml
  hardware_metrics_dashboard:
    file: ../../servicio-monitoreo/grafana/dashboards/hardware-metrics.json
  api_telemetry_dashboard:
    file: ../../servicio-monitoreo/grafana/dashboards/api-telemetry.json
  api_full_telemetry_dashboard:
    file: ../../servicio-monitoreo/grafana/dashboards/api-full-telemetry.json
  clickhouse_init_sql:
    file: ../../servicio-monitoreo/config/clickhouse/init/001_tablas.sql
