services:
  kafka:
    image: confluentinc/cp-kafka:7.4.0
    container_name: bunna-kafka
    ports:
      - "9092:9092"
      - "29092:29092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: 'broker,controller'
      KAFKA_CONTROLLER_QUORUM_VOTERS: '1@localhost:9093'
      KAFKA_LISTENERS: 'PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093,PLAINTEXT_HOST://0.0.0.0:29092'
      KAFKA_ADVERTISED_LISTENERS: 'PLAINTEXT://kafka:9092,PLAINTEXT_HOST://localhost:29092'
      KAFKA_INTER_BROKER_LISTENER_NAME: 'PLAINTEXT'
      KAFKA_CONTROLLER_LISTENER_NAMES: 'CONTROLLER'
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: 'CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT'
      CLUSTER_ID: 'MkU3OEVBNTcwNTJENDM2Qk'
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
    networks:
      - bunna-network

  db:
    image: postgres:16-alpine
    container_name: identidad-db-dev
    environment:
      - POSTGRES_USER=identidad_user
      - POSTGRES_PASSWORD=identidad_pass_dev
      - POSTGRES_DB=identidad_db
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U identidad_user -d identidad_db"]
      interval: 5s
      timeout: 5s
      retries: 5
    volumes:
      - bunna_postgres_data:/var/lib/postgresql/data
    networks:
      - bunna-network

  identidad-app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: identidad-app-dev
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy
      kafka:
        condition: service_started
    ports:
      - "8080:8080"
    environment:
      - DB_HOST=db
      - DB_PORT=5432
      - DB_USER=identidad_user
      - DB_PASSWORD=identidad_pass_dev
      - DB_NAME=identidad_db
      - DB_SSLMODE=disable
      - PORT=8080
      - JWT_SECRET=supersecreto_dev_cambiar_en_prod
      - JWT_ISSUER=identidad.bunna
      - TELEMETRY_ENABLED=true
      - KAFKA_BROKERS=kafka:9092
    networks:
      - bunna-network

networks:
  bunna-network:
    driver: bridge

volumes:
  bunna_postgres_data:
