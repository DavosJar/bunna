services:
  kafka:
    image: ${KAFKA_IMAGE:-confluentinc/cp-kafka:7.4.0}
    ports:
      - target: 9092
        published: ${KAFKA_PORT:-9092}
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: 'broker,controller'
      KAFKA_CONTROLLER_QUORUM_VOTERS: '1@kafka:29093'
      KAFKA_LISTENERS: 'PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:29093'
      KAFKA_ADVERTISED_LISTENERS: 'PLAINTEXT://kafka:9092'
      KAFKA_INTER_BROKER_LISTENER_NAME: 'PLAINTEXT'
      KAFKA_CONTROLLER_LISTENER_NAMES: 'CONTROLLER'
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: 'CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT'
      CLUSTER_ID: ${CLUSTER_ID:-MkU3OEVBNTcwNTJENDM2Qk}
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_HEAP_OPTS: ${KAFKA_HEAP_OPTS:--Xms512M -Xmx1G}
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
    command: |
      bash -c '
        /etc/confluent/docker/run &
        until kafka-topics --bootstrap-server localhost:9092 --list >/dev/null 2>&1; do sleep 2; done;
        while IFS= read -r topic; do
          [ -z "$$topic" ] && continue;
          kafka-topics --create --if-not-exists --topic "$$topic" --partitions 1 --replication-factor 1 --bootstrap-server localhost:9092;
        done < /etc/kafka/topics.txt;
        wait
      '
    healthcheck:
      test: ["CMD-SHELL", "kafka-topics --bootstrap-server localhost:9092 --list || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s
    configs:
      - source: topics_txt
        target: /etc/kafka/topics.txt
    deploy:
      replicas: 1
      placement:
        constraints:
          - ${PLACEMENT_CONSTRAINT:-node.role == worker}

  hardware-monitor-agent:
    image: ${REGISTRY:-172.31.36.189:5000}/hardware-monitor-agent:release
    depends_on:
      - kafka
    environment:
      - KAFKA_BROKERS=kafka:9092
      - SAMPLE_INTERVAL_MS=5000
      - CLOUD_PROVIDER=local
      - NODE_ID={{.Node.Hostname}}
    volumes:
      - /etc/hostname:/etc/host_hostname:ro
    deploy:
      mode: global

  servicio-monitoreo:
    image: ${REGISTRY:-172.31.36.189:5000}/servicio-monitoreo:release
    depends_on:
      - kafka
      - clickhouse
    environment:
      - KAFKA_BROKERS=kafka:9092
      - KAFKA_TOPIC_TELEMETRIA=telemetry
      - KAFKA_TOPIC_HARDWARE_METRICAS=hardware.metrics
      - KAFKA_TOPIC_HARDWARE_ALERTAS=hardware.alerts
      - GRUPO_CONSUMIDOR=monitor-ingestor
      - CLICKHOUSE_URL=http://clickhouse:8123
      - CLICKHOUSE_USUARIO=monitoreo
      - CLICKHOUSE_CONTRASENA=monitoreo_dev
      - CLICKHOUSE_BD=bunna_monitoreo
      - RUST_LOG=info
    deploy:
      replicas: 1
      placement:
        constraints:
          - ${PLACEMENT_CONSTRAINT:-node.role == worker}

  clickhouse:
    image: ${CH_IMAGE:-clickhouse/clickhouse-server:latest}
    ports:
      - target: 8123
        published: ${CH_HTTP_PORT:-8123}
      - target: 9000
        published: ${CH_NATIVE_PORT:-9000}
    environment:
      - CLICKHOUSE_USER=${CH_USER:-monitoreo}
      - CLICKHOUSE_PASSWORD=${CH_PASS:-monitoreo_dev}
      - CLICKHOUSE_DB=${CH_DB:-bunna_monitoreo}
    volumes:
      - clickhouse_data_infra:/var/lib/clickhouse
    configs:
      - source: clickhouse_init_sql
        target: /docker-entrypoint-initdb.d/001_tablas.sql
    deploy:
      replicas: 1
      placement:
        constraints:
          - ${PLACEMENT_CONSTRAINT:-node.role == worker}

  grafana:
    image: ${GRAFANA_IMAGE:-grafana/grafana:latest}
    ports:
      - target: 3000
        published: ${GRAFANA_PORT:-3000}
    environment:
      - GF_INSTALL_PLUGINS=${GF_INSTALL_PLUGINS:-grafana-clickhouse-datasource}
      - GF_SECURITY_ADMIN_USER=${GF_SECURITY_ADMIN_USER:-admin}
      - GF_SECURITY_ADMIN_PASSWORD=${GF_SECURITY_ADMIN_PASSWORD:-admin}
    configs:
      - source: clickhouse_datasource
        target: /etc/grafana/provisioning/datasources/clickhouse.yaml
      - source: dashboards_provider
        target: /etc/grafana/provisioning/dashboards/proveedor.yaml
      - source: hardware_metrics_dashboard
        target: /etc/grafana/provisioning/dashboards/hardware-metrics.json
      - source: api_telemetry_dashboard
        target: /etc/grafana/provisioning/dashboards/api-telemetry.json
      - source: business_ops_dashboard
        target: /etc/grafana/provisioning/dashboards/business-ops.json
      - source: data_queries_dashboard
        target: /etc/grafana/provisioning/dashboards/data-queries.json
      - source: api_endpoint_deep_dive_dashboard
        target: /etc/grafana/provisioning/dashboards/api-endpoint-deep-dive.json
      - source: api_full_telemetry_dashboard
        target: /etc/grafana/provisioning/dashboards/api-full-telemetry.json
    deploy:
      replicas: 1
      placement:
        constraints:
          - ${PLACEMENT_CONSTRAINT:-node.role == worker}

volumes:
  clickhouse_data_infra:

networks:
  default:
    name: bunna-prod-net
    driver: overlay
    attachable: true

configs:
  topics_txt:
    file: ../prod/topics.txt
  clickhouse_datasource:
    file: ../../servicio-monitoreo/grafana/datasources/clickhouse.yaml
  dashboards_provider:
    file: ../../servicio-monitoreo/grafana/dashboards/proveedor.yaml
  hardware_metrics_dashboard:
    file: ../../servicio-monitoreo/grafana/dashboards/hardware-metrics.json
  api_telemetry_dashboard:
    file: ../../servicio-monitoreo/grafana/dashboards/api-telemetry.json
  business_ops_dashboard:
    file: ../../servicio-monitoreo/grafana/dashboards/business-ops.json
  data_queries_dashboard:
    file: ../../servicio-monitoreo/grafana/dashboards/data-queries.json
  api_endpoint_deep_dive_dashboard:
    file: ../../servicio-monitoreo/grafana/dashboards/api-endpoint-deep-dive.json
  api_full_telemetry_dashboard:
    file: ../../servicio-monitoreo/grafana/dashboards/api-full-telemetry.json
  clickhouse_init_sql:
    file: ../../servicio-monitoreo/config/clickhouse/init/001_tablas.sql
