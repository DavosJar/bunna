services:
  kafka:
    image: ${KAFKA_IMAGE:-confluentinc/cp-kafka:7.4.0}
    ports:
      - target: 9092
        published: ${KAFKA_PORT:-9092}
      - target: 29092
        published: ${KAFKA_PORT_EXT:-29092}
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: 'broker,controller'
      KAFKA_CONTROLLER_QUORUM_VOTERS: '1@kafka:29093'
      KAFKA_LISTENERS: 'PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:29093,PLAINTEXT_HOST://0.0.0.0:29092'
      KAFKA_ADVERTISED_LISTENERS: 'PLAINTEXT://kafka:9092,PLAINTEXT_HOST://localhost:${KAFKA_PORT_EXT:-29092}'
      KAFKA_INTER_BROKER_LISTENER_NAME: 'PLAINTEXT'
      KAFKA_CONTROLLER_LISTENER_NAMES: 'CONTROLLER'
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: 'CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT'
      CLUSTER_ID: ${CLUSTER_ID:-MkU3OEVBNTcwNTJENDM2Qk}
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_HEAP_OPTS: ${KAFKA_HEAP_OPTS:--Xms512M -Xmx1G}
    deploy:
      replicas: 1
      placement:
        constraints:
          - ${PLACEMENT_CONSTRAINT:-node.role == worker}

  hardware-monitor-agent:
    image: 172.31.36.189:5000/hardware-monitor-agent:release
    depends_on:
      - kafka
    environment:
      - KAFKA_BROKERS=kafka:9092
      - SAMPLE_INTERVAL_MS=5000
      - KAFKA_TOPIC=hardware_metrics
      - CLOUD_PROVIDER=local
      - NODE_ID={{.Node.Hostname}}
    volumes:
      - /etc/hostname:/etc/host_hostname:ro
    deploy:
      mode: global

  servicio-monitoreo:
    image: 172.31.36.189:5000/servicio-monitoreo:release
    depends_on:
      - kafka
      - clickhouse
    environment:
      - KAFKA_BROKERS=kafka:9092
      - KAFKA_TOPIC_TELEMETRIA=telemetry
      - KAFKA_TOPIC_HARDWARE_METRICAS=hardware.metrics
      - KAFKA_TOPIC_HARDWARE_ALERTAS=hardware.alerts
      - GRUPO_CONSUMIDOR=monitor-ingestor-${ENV:-test}
      - CLICKHOUSE_URL=http://clickhouse:8123
      - CLICKHOUSE_USUARIO=monitoreo
      - CLICKHOUSE_CONTRASENA=monitoreo_dev
      - CLICKHOUSE_BD=bunna_monitoreo
      - RUST_LOG=info
    deploy:
      replicas: 1
      placement:
        constraints:
          - ${PLACEMENT_CONSTRAINT:-node.role == worker}

  clickhouse:
    image: ${CH_IMAGE:-clickhouse/clickhouse-server:latest}
    ports:
      - target: 8123
        published: ${CH_HTTP_PORT:-8123}
      - target: 9000
        published: ${CH_NATIVE_PORT:-9000}
    environment:
      - CLICKHOUSE_USER=${CH_USER:-monitoreo}
      - CLICKHOUSE_PASSWORD=${CH_PASS:-monitoreo_dev}
      - CLICKHOUSE_DB=${CH_DB:-bunna_monitoreo}
    volumes:
      - clickhouse_data_prod:/var/lib/clickhouse
    configs:
      - source: clickhouse_init_sql
        target: /docker-entrypoint-initdb.d/001_tablas.sql
    deploy:
      replicas: 1
      placement:
        constraints:
          - ${PLACEMENT_CONSTRAINT:-node.role == worker}

  grafana:
    image: ${GRAFANA_IMAGE:-grafana/grafana:latest}
    ports:
      - target: 3000
        published: ${GRAFANA_PORT:-3000}
    environment:
      - GF_INSTALL_PLUGINS=${GF_INSTALL_PLUGINS:-grafana-clickhouse-datasource}
      - GF_SECURITY_ADMIN_USER=${GF_SECURITY_ADMIN_USER:-admin}
      - GF_SECURITY_ADMIN_PASSWORD=${GF_SECURITY_ADMIN_PASSWORD:-admin}
    configs:
      - source: clickhouse_datasource
        target: /etc/grafana/provisioning/datasources/clickhouse.yaml
      - source: dashboards_provider
        target: /etc/grafana/provisioning/dashboards/proveedor.yaml
      - source: hardware_metrics_dashboard
        target: /etc/grafana/provisioning/dashboards/hardware-metrics.json
      - source: api_telemetry_dashboard
        target: /etc/grafana/provisioning/dashboards/api-telemetry.json
    deploy:
      replicas: 1
      resources:
        limits:
          cpus: ${GRAFANA_CPU_LIMIT:-0.5}
          memory: ${GRAFANA_MEM_LIMIT:-256M}
        reservations:
          cpus: '0.25'
          memory: 128M
      placement:
        constraints:
          - ${PLACEMENT_CONSTRAINT:-node.role == worker}

volumes:
  clickhouse_data_prod:

networks:
  default:
    name: bunna-prod-net
    driver: overlay
    attachable: true

configs:
  clickhouse_datasource:
    file: ../../servicio-monitoreo/grafana/datasources/clickhouse.yaml
  dashboards_provider:
    file: ../../servicio-monitoreo/grafana/dashboards/proveedor.yaml
  hardware_metrics_dashboard:
    file: ../../servicio-monitoreo/grafana/dashboards/hardware-metrics.json
  api_telemetry_dashboard:
    file: ../../servicio-monitoreo/grafana/dashboards/api-telemetry.json
  clickhouse_init_sql:
    file: ../../servicio-monitoreo/config/clickhouse/init/001_tablas.sql
