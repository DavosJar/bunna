services:
  kafka:
    image: confluentinc/cp-kafka:7.4.0
    ports:
      - target: 9092
        published: 9092
      - target: 29092
        published: 19093
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: 'broker,controller'
      KAFKA_CONTROLLER_QUORUM_VOTERS: '1@127.0.0.1:29093'
      KAFKA_LISTENERS: 'INTERNAL://0.0.0.0:9092,CONTROLLER://0.0.0.0:29093,EXTERNAL://0.0.0.0:29092'
      KAFKA_ADVERTISED_LISTENERS: 'INTERNAL://kafka:9092,EXTERNAL://3.141.219.34:19093'
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: 'CONTROLLER:PLAINTEXT,INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT'
      KAFKA_INTER_BROKER_LISTENER_NAME: 'INTERNAL'
      KAFKA_CONTROLLER_LISTENER_NAMES: 'CONTROLLER'
      CLUSTER_ID: 'MkU3OEVBNTcwNTJENDM2Qk'
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.role == worker

  kafka-init:
    image: confluentinc/cp-kafka:7.4.0
    depends_on:
      - kafka
    command: |
      bash -c '
        echo "Esperando a Kafka...";
        until kafka-topics --bootstrap-server kafka:9092 --list >/dev/null 2>&1; do
          sleep 3;
        done;
        echo "Kafka listo. Creando topics...";
        for topic in dev.permisos dev.iam.roles test.permisos test.iam.roles prod.permisos prod.iam.roles telemetry hardware.metrics hardware.alerts; do
          kafka-topics --create --if-not-exists --topic "$$topic" --partitions 1 --replication-factor 1 --bootstrap-server kafka:9092;
        done;
        echo "Topics creados correctamente."
      '
    deploy:
      restart_policy:
        condition: none
      placement:
        constraints:
          - node.role == worker
  clickhouse:
    image: ${CH_IMAGE:-clickhouse/clickhouse-server:latest}
    ports:
      - target: 8123
        published: ${CH_HTTP_PORT:-8123}
      - target: 9000
        published: ${CH_NATIVE_PORT:-9000}
    environment:
      - CLICKHOUSE_USER=${CH_USER:-monitoreo}
      - CLICKHOUSE_PASSWORD=${CH_PASS:-monitoreo_dev}
      - CLICKHOUSE_DB=${CH_DB:-bunna_monitoreo}
    volumes:
      - clickhouse_data_infra:/var/lib/clickhouse
    deploy:
      replicas: 1
      placement:
        constraints:
          - ${PLACEMENT_CONSTRAINT:-node.role == worker}

  grafana:
    image: ${GRAFANA_IMAGE:-grafana/grafana:latest}
    ports:
      - target: 3000
        published: ${GRAFANA_PORT:-3000}
    environment:
      - GF_INSTALL_PLUGINS=${GF_INSTALL_PLUGINS:-grafana-clickhouse-datasource}
      - GF_SECURITY_ADMIN_USER=${GF_SECURITY_ADMIN_USER:-admin}
      - GF_SECURITY_ADMIN_PASSWORD=${GF_SECURITY_ADMIN_PASSWORD:-admin}
    configs:
      - source: clickhouse_datasource
        target: /etc/grafana/provisioning/datasources/clickhouse.yaml
      - source: dashboards_provider
        target: /etc/grafana/provisioning/dashboards/proveedor.yaml
      - source: hardware_metrics_dashboard
        target: /etc/grafana/provisioning/dashboards/hardware-metrics.json
      - source: api_telemetry_dashboard
        target: /etc/grafana/provisioning/dashboards/api-telemetry.json
      - source: business_ops_dashboard
        target: /etc/grafana/provisioning/dashboards/business-ops.json
      - source: data_queries_dashboard
        target: /etc/grafana/provisioning/dashboards/data-queries.json
      - source: api_endpoint_deep_dive_dashboard
        target: /etc/grafana/provisioning/dashboards/api-endpoint-deep-dive.json
      - source: api_full_telemetry_dashboard
        target: /etc/grafana/provisioning/dashboards/api-full-telemetry.json
    deploy:
      replicas: 1
      placement:
        constraints:
          - ${PLACEMENT_CONSTRAINT:-node.role == worker}

volumes:
  clickhouse_data_infra:

networks:
  default:
    name: bunna-prod-net
    driver: overlay
    attachable: true

configs:
  topics_txt:
    file: ../prod/topics.txt
  clickhouse_datasource:
    file: ../../servicio-monitoreo/grafana/datasources/clickhouse.yaml
  dashboards_provider:
    file: ../../servicio-monitoreo/grafana/dashboards/proveedor.yaml
  hardware_metrics_dashboard:
    file: ../../servicio-monitoreo/grafana/dashboards/hardware-metrics.json
  api_telemetry_dashboard:
    file: ../../servicio-monitoreo/grafana/dashboards/api-telemetry.json
  business_ops_dashboard:
    file: ../../servicio-monitoreo/grafana/dashboards/business-ops.json
  data_queries_dashboard:
    file: ../../servicio-monitoreo/grafana/dashboards/data-queries.json
  api_endpoint_deep_dive_dashboard:
    file: ../../servicio-monitoreo/grafana/dashboards/api-endpoint-deep-dive.json
  api_full_telemetry_dashboard:
    file: ../../servicio-monitoreo/grafana/dashboards/api-full-telemetry.json
